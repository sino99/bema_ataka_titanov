<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Атака Титанов: Бема</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Nunito:wght@400;700;900&family=Ruslan+Display&display=swap" rel="stylesheet" />
</head>
<body>
<canvas id="game"></canvas>
<button id="mute" aria-label="Звук">
  <svg class="ico-on" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
  <svg class="ico-off" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></svg>
</button>
<div id="rotate">
  <div class="rot-box">
    <div class="rot-ico"><svg viewBox="0 0 96 96" width="96" height="96" fill="none" stroke="#f7e3a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><g class="rot-phone"><rect x="34" y="14" width="28" height="48" rx="5"/><path d="M45 56h6"/></g><path d="M20 70a34 34 0 0 0 56 8"/><path d="M76 78l1-12"/><path d="M76 78l-11-3"/></svg></div>
    <p>Поверни телефон горизонтально</p>
    <button id="rotate-skip">Всё равно играть</button>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
